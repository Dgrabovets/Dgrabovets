<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-labelledby="t d">
  <title id="t">Aeternus</title>
  <desc id="d">Backend developer, C# and .NET. Telegram Mini Apps, APIs, gongfu tea.</desc>
  <style>
    .name{font:700 56px 'JetBrains Mono','IBM Plex Mono',Consolas,'Courier New',monospace;fill:#F3F2EE}
    .role{font:500 20px 'JetBrains Mono','IBM Plex Mono',Consolas,'Courier New',monospace;fill:#5FE08A}
    .meta{font:400 16px 'IBM Plex Sans','Segoe UI',Arial,sans-serif;fill:#8D8B84}
    .steam{fill:none;stroke:#5FE08A;stroke-width:3;stroke-linecap:round;opacity:0;animation:rise 4s ease-in-out infinite}
    .s2{animation-delay:1.3s}.s3{animation-delay:2.6s}
    @keyframes rise{0%{opacity:0;transform:translateY(8px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
    @media (prefers-reduced-motion:reduce){.steam{animation:none;opacity:.5}}
